<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#3B5B4A">
<title>AMELA Prospection</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AMELA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Mise en page : sur téléphone une colonne et les onglets en bas ; sur ordinateur un menu vert à gauche
     et le contenu sur toute la largeur, en deux colonnes. Cartes claires sur fond crème.
     Le « parcours » en quatre points dorés revient sur chaque prospect : c'est le fil de A à Z. */
  --bg: #F5F0EB;
  --surface: #FFFFFF;
  --surface-2: #ECE4D8;
  --ink: #22302A;
  --muted: #5F6A63;
  --line: #DCD2C3;
  --primary: #3B5B4A;
  --on-primary: #FFFFFF;
  --brand-bg: #3B5B4A;
  --brand-ink: #F5F0EB;
  --gold: #C8A96E;
  --gold-ink: #765919;
  --brand-accent: #C8A96E;
  --on-gold: #2A2110;
  --ok: #2B7550;
  --warn: #9A630B;
  --danger: #AD3B2B;
  --shade: rgba(24, 32, 27, .5);
  --font-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --font-body: 'Jost', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; font-variant-numeric: lining-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--primary); }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--gold-ink); outline-offset: 2px; border-radius: 6px; }
.top :focus-visible { outline-color: var(--brand-ink); }
svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#app { position: relative; height: 100%; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }

/* En-tête */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; background: var(--brand-bg); color: var(--brand-ink); flex: none; }
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .14em; }
.brand-sub { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--brand-accent); white-space: nowrap; }
.sync { display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(245, 240, 235, .35); background: transparent; color: var(--brand-ink); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; min-height: 32px; white-space: nowrap; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-accent); }
.sync.cloud .dot { background: #7FD3A6; }

/* Zone principale */
#view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 18px; }
#view:focus { outline: none; }
#view > *, .sheet-body > *, .dialog > * { flex-shrink: 0; }
.eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-ink); font-weight: 600; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.05; color: var(--primary); text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; color: var(--primary); text-wrap: balance; }
h3 { font-size: 16px; font-weight: 600; line-height: 1.25; }
.lede { color: var(--muted); font-size: 16px; max-width: 34em; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.count { font-size: 13px; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }

/* Cartes */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card.gold { border-color: var(--gold); box-shadow: inset 3px 0 0 var(--gold); }
.card.soft { background: var(--surface-2); border-color: transparent; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 11px; border: 1px solid var(--primary); background: var(--primary); color: var(--on-primary); font-weight: 500; text-decoration: none; text-align: center; line-height: 1.2; }
.btn.ghost { background: transparent; color: var(--primary); border-color: var(--line); }
.btn.goldb { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--line); }
.btn.sm { min-height: 38px; padding: 7px 12px; font-size: 14.5px; border-radius: 9px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .55; cursor: default; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--primary); text-decoration: underline; text-underline-offset: 3px; font-size: 14.5px; min-height: 32px; }
.fab { position: absolute; right: 16px; bottom: 76px; z-index: 5; box-shadow: 0 6px 18px rgba(20, 30, 24, .28); border-radius: 999px; padding: 12px 18px; }

/* Onglets */
.tabs { order: 1; flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); }
.tabs a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px 9px; font-size: 11.5px; color: var(--muted); text-decoration: none; border-top: 3px solid transparent; min-height: 58px; }
.tabs a[aria-current="page"] { color: var(--primary); border-top-color: var(--gold); font-weight: 600; }
.tabs a { position: relative; }
.tabs .badge { position: absolute; top: 5px; left: 50%; margin-left: 5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; line-height: 18px; text-align: center; font-weight: 600; }
.tabs a span.lab { white-space: nowrap; }

/* Le parcours */
.rail { display: flex; align-items: center; gap: 0; }
.rail i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--line); }
.rail b { flex: 1; height: 2px; background: var(--line); }
.rail i.done, .rail b.done { background: var(--gold); border-color: var(--gold); }
.rail i.now { width: 14px; height: 14px; background: var(--primary); border: 3px solid var(--gold); }
.rail.lost i, .rail.lost b { opacity: .45; }
.funnel { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 4px; }
.funnel button { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 6px 0; border-radius: 8px; min-height: 64px; }
.funnel .n { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1; color: var(--primary); }
.funnel .n.zero { color: var(--muted); opacity: .6; }
.funnel .l { font-size: 12px; line-height: 1.2; color: var(--muted); text-align: center; overflow-wrap: break-word; }

/* Chiffres */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 9px; }
.kpi .n { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.05; color: var(--primary); font-variant-numeric: tabular-nums lining-nums; }
.kpi .l { font-size: 12px; color: var(--muted); line-height: 1.25; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--gold); border-radius: 4px; }

/* Listes */
.task, .pcard { display: flex; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; gap: 12px; align-items: center; }
.pcard { flex-direction: column; align-items: stretch; gap: 8px; }
.task .t-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.task .t-name, .pname { font-weight: 600; overflow-wrap: anywhere; }
.task .t-what { font-size: 14.5px; color: var(--muted); }
.task .t-when { font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--gold-ink); }
.task.late { border-color: var(--danger); }
.task.late .t-when { color: var(--danger); }
.pmeta { font-size: 13.5px; color: var(--muted); }
.pnext { font-size: 13.5px; color: var(--gold-ink); font-weight: 500; }
.pnext.late { color: var(--danger); }
.pnext.none { color: var(--muted); font-weight: 400; }
.grade { flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 26px; padding: 0 8px; border-radius: 8px; font-weight: 600; font-size: 13.5px; border: 1.5px solid currentColor; }
.grade.A { color: var(--ok); }
.grade.B { color: var(--gold-ink); }
.grade.C { color: var(--muted); }
.pill { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 999px; background: var(--surface-2); font-size: 12.5px; color: var(--ink); white-space: nowrap; }
.pill.lost { color: var(--muted); }
.pill.new { background: var(--gold); color: var(--on-gold); font-weight: 600; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 36px; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; color: var(--ink); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check .box { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; color: transparent; margin-top: 1px; }
.check.done .box { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.check.done .box svg { width: 14px; height: 14px; stroke-width: 2.4; }
.check.done .txt { color: var(--muted); text-decoration: line-through; }
.check button.txt { background: none; border: 0; padding: 0; text-align: left; text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }

/* Recommandations */
.reco h3 { overflow-wrap: anywhere; }
.why { display: flex; flex-direction: column; gap: 5px; font-size: 14.5px; }
.why li { position: relative; padding-left: 16px; }
.why li::before { content: ''; position: absolute; left: 2px; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.tip { font-size: 14px; color: var(--muted); }
.coords { font-size: 14px; overflow-wrap: anywhere; }
.insight { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.insight .num { flex: none; font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1; color: var(--gold-ink); width: 18px; }
.aiout { white-space: pre-wrap; font-size: 15px; background: var(--surface-2); border-radius: 12px; padding: 12px 14px; overflow-wrap: anywhere; }

/* Fiche */
.sheet { position: absolute; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; }
.sheet-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--brand-bg); color: var(--brand-ink); }
.sheet-head .back { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; color: var(--brand-ink); min-height: 40px; padding: 6px 8px; font-size: 15px; }
.sheet-head .ttl { flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 14px; }
.stagebox .now-label { font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--primary); line-height: 1.1; }
.steps { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.15; }
.steps span:first-child { text-align: left; }
.steps span:last-child { text-align: right; }
.steps span.on { color: var(--primary); font-weight: 600; }
.acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.acts .btn { padding: 8px 6px; font-size: 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.log li { display: flex; flex-direction: column; gap: 1px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.log li:first-child { border-top: 0; padding-top: 0; }
.log .when { font-size: 12.5px; color: var(--muted); }
.log .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.scorebar { display: flex; align-items: center; gap: 10px; }
.scorebar .bar { flex: 1; }
.scorebar .sc { font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--primary); font-variant-numeric: tabular-nums lining-nums; }

/* Formulaires et fenêtres */
.dialog-wrap { position: absolute; inset: 0; z-index: 40; background: var(--shade); display: flex; align-items: flex-end; justify-content: center; }
.dialog { width: 100%; max-height: 94%; overflow-y: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding: 18px 16px 22px; display: flex; flex-direction: column; gap: 14px; }
.dialog h2 { font-size: 24px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > label, .legend { font-size: 14px; font-weight: 500; }
.field .help { font-size: 13px; color: var(--muted); }
input[type="text"], input[type="tel"], input[type="email"], input[type="url"], input[type="number"], input[type="date"], input[type="search"], select, textarea { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-size: 16px; }
textarea { min-height: 96px; resize: vertical; line-height: 1.4; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts label { position: relative; }
.opts input { position: absolute; opacity: 0; inset: 0; }
.opts span { display: inline-flex; align-items: center; min-height: 38px; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14.5px; }
.opts input:checked + span { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.opts input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }
.tick { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.tick input { width: 20px; height: 20px; margin-top: 2px; flex: none; accent-color: var(--primary); }
details.more > summary { cursor: pointer; color: var(--primary); font-weight: 500; padding: 6px 0; }
details.more[open] > summary { margin-bottom: 10px; }
.notice { border-radius: 12px; padding: 11px 13px; font-size: 14.5px; background: var(--surface-2); }
.notice.warn { border: 1px solid var(--warn); background: transparent; }
.toast { position: absolute; left: 16px; right: 16px; bottom: 74px; z-index: 60; display: flex; justify-content: center; pointer-events: none; }
.toast span { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14.5px; max-width: 100%; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }

/* Assistante */
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quick .btn { min-height: 48px; font-size: 14.5px; padding: 8px 10px; }
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; padding: 10px 13px; border-radius: 14px; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--primary); color: var(--on-primary); border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg-tools { align-self: flex-start; display: flex; gap: 14px; margin-top: -4px; padding-left: 4px; }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { min-height: 48px; }

/* Guide et tableaux */
.tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.tbl th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--muted); padding: 0 8px 6px 0; }
.tbl td { padding: 8px 8px 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
.tbl td.n, .tbl th.n { text-align: right; padding-right: 0; white-space: nowrap; font-variant-numeric: tabular-nums lining-nums; }
.tbl-wrap { overflow-x: auto; }
.bignum { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; color: var(--primary); }
.numbered { counter-reset: n; display: flex; flex-direction: column; gap: 9px; }
.numbered li { counter-increment: n; position: relative; padding-left: 34px; font-size: 15px; }
.numbered li::before { content: counter(n); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--gold); color: var(--primary); font-weight: 600; font-size: 13px; display: grid; place-items: center; }
.quote { border-left: 3px solid var(--gold); background: var(--surface-2); padding: 12px 14px; border-radius: 0 12px 12px 0; font-style: italic; font-size: 15px; }
.menu a, .menu button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-decoration: none; color: var(--ink); min-height: 60px; }
.menu .m-t { font-weight: 600; }
.menu .m-d { font-size: 13.5px; color: var(--muted); }
.links { display: flex; flex-direction: column; gap: 6px; }
.links a { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-decoration: none; color: var(--ink); font-size: 14.5px; min-height: 44px; }

@media (max-width: 380px) {
  #view, .sheet-body { padding-left: 14px; padding-right: 14px; }
  h1 { font-size: 30px; }
  .steps { font-size: 11px; }
  .two { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .dialog { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(18px); } to { transform: none; } }
}
.tbl th + th, .tbl td + td { padding-left: 12px; }
.tbl th { white-space: nowrap; }
.gate { position: absolute; inset: 0; z-index: 80; background: var(--bg); display: flex; flex-direction: column; overflow-y: auto; }
.gate-body { padding: 28px 18px; display: flex; flex-direction: column; gap: 14px; max-width: 460px; width: 100%; margin: 0 auto; }
.gate-body input { font-size: 20px; letter-spacing: .08em; text-transform: uppercase; }

/* Colonnes et grilles : empilées sur téléphone, côte à côte sur grand écran */
.cols, .col, .toolbar { display: flex; flex-direction: column; gap: inherit; }
.rgrid { display: flex; flex-direction: column; gap: inherit; }
.cols > *, .col > *, .toolbar > *, .rgrid > * { flex-shrink: 0; }

/* Tablette, petite fenêtre : toute la largeur, contenu centré */
@media (min-width: 640px) {
  #view { padding-left: max(24px, calc((100% - 720px) / 2)); padding-right: max(24px, calc((100% - 720px) / 2)); }
  .sheet-body { padding-left: max(24px, calc((100% - 720px) / 2)); padding-right: max(24px, calc((100% - 720px) / 2)); }
  .dialog { max-width: 640px; }
  #plist, .rgrid, .menu.stack { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  #plist > :not(.pcard) { grid-column: 1 / -1; }
  .rgrid.wide { grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; }
}

/* Ordinateur : menu vert à gauche, contenu sur toute la largeur */
@media (min-width: 900px) {
  #app { display: grid; grid-template-columns: 232px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  #app > .top { grid-column: 1; grid-row: 1; flex-direction: column; align-items: flex-start; gap: 16px; padding: 28px 22px 20px; }
  #app > .top .brand { flex-direction: column; align-items: flex-start; gap: 3px; }
  #app > .top .brand-name { font-size: 30px; }
  #app > .tabs { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; gap: 4px; padding: 6px 12px 24px; background: var(--brand-bg); border-top: 0; }
  .tabs a { flex-direction: row; gap: 12px; min-height: 46px; padding: 10px 14px; border-top: 0; border-radius: 10px; font-size: 15px; color: rgba(245, 240, 235, .82); }
  .tabs a:hover { background: rgba(245, 240, 235, .1); color: var(--brand-ink); }

async function sbRpc(body) {
  let res;
  try {
    res = await fetch(SB.url, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB.key, Authorization: 'Bearer ' + SB.key }, body: JSON.stringify(body) });

async function sbExchange(prospects, etat, complet) {
  const full = complet || !remote.depuis;
  const j = await sbRpc({ p_code: remote.code, p_depuis: full ? null : remote.depuis, p_prospects: prospects, p_etat: etat, p_complet: full });

/* File d'attente : un seul échange à la fois, les écritures proches partent ensemble. */
async function sbPump() {
  if (remote.pumping) return;

  try {
    while (remote.out.length || remote.wantPull) {
      const batch = remote.out.splice(0, 100);
      const complet = remote.wantFull;
      remote.wantPull = false; remote.wantFull = false;
      const prospects = []; let etat = null;
      batch.forEach(b => { if (b.item) prospects.push(b.item); if (b.etat) etat = b.etat; });
      try {
        await sbExchange(prospects, etat, complet);

/* Même contrat que l'IA intégrée de Claude : sample(texte ou messages, { onText, signal }) → { text, truncated }. */
async function sbSample(input, o) {
  o = o || {};
  if (!remote.code) throw { code: 'unavailable', message: 'pas de code' };
  const ctl = new AbortController();
  if (o.signal) {
    if (o.signal.aborted) throw { code: 'cancelled', message: 'annulé' };
    o.signal.addEventListener('abort', () => ctl.abort(), { once: true });
  }
  let res;
  try {
    res = await fetch(SB.ia, { method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctl.signal,
      body: JSON.stringify({ code: remote.code, input, rapide: o.modelTier === 'quick', json: !!o.json }) });
  } catch (e) { throw ctl.signal.aborted ? { code: 'cancelled', message: 'annulé' } : { code: 'network', message: 'réseau' }; }
  if (!res.ok || !res.body) {
    let j = null;
    try { j = await res.json(); } catch (e) { /* réponse vide */ }
    throw sbIaErreur(j && j.erreur, res.status);
  }
  const lect = res.body.getReader();
  const dec = new TextDecoder();
  let tampon = '', text = '', stop = '', err = '', fini = false;
  try {
    for (;;) {
      const { value, done } = await lect.read();
      if (done) break;
      tampon += dec.decode(value, { stream: true });
      let i;
      while ((i = tampon.indexOf('\n')) >= 0) {
        const ligne = tampon.slice(0, i);
        tampon = tampon.slice(i + 1);
        if (!ligne.trim()) continue;
        let m;
        try { m = JSON.parse(ligne); } catch (e) { continue; }
        if (typeof m.d === 'string' && m.d) {
          text += m.d;
          if (o.onText) { try { o.onText({ text, delta: m.d }); } catch (e) { /* affichage seulement */ } }
        } else if (m.err) err = m.err;
        else if (m.fin) { fini = true; stop = m.stop || ''; }
      }
    }
  } catch (e) {
    if (ctl.signal.aborted) throw { code: 'cancelled', message: 'annulé', text };
    throw { code: 'network', message: 'coupure', text };
  }
  if (ctl.signal.aborted) throw { code: 'cancelled', message: 'annulé', text };
  if (err) throw Object.assign(sbIaErreur(err), { text });
  if (!fini || !stop) throw { code: 'network', message: 'réponse incomplète', text };
  if (stop === 'refusal') throw { code: 'refused', message: 'refus', text };
  return { text, truncated: stop === 'max_tokens' };
}

function askAssistant(q, p, x) {

  const fallback = () => (TPL[q.id] ? TPL[q.id](p, x) : '');
  if (!aiUsable()) {
    S.chat.push({ role: 'user', content, show }, { role: 'assistant', content: fallback() });

  }

async function assistantSend(show, content, fallback) {
  if (UI.chatBusy) return;
  S.chat.push({ role: 'user', content, show });
  UI.chatBusy = true; UI.chatStream = '';
  if (UI.tab === 'assistante') { render(); scrollChat(); } else renderChat();
  let text = '';
  try {
    const turns = [{ role: 'user', content: kbText() }].concat(S.chat.slice(-10).map(m => ({ role: m.role, content: m.content })));
    const res = await runAI(turns, { onText: u => { text = u.text; UI.chatStream = cleanAI(text); const b = $('#chat-pending'); if (b) { b.textContent = UI.chatStream; scrollChat(); } } });
    S.chat.push({ role: 'assistant', content: cleanAI(res.text) });
  } catch (e) {
    const partial = cleanAI((e && e.text) || text);
    if (e && e.code === 'cancelled') { if (partial) S.chat.push({ role: 'assistant', content: partial + '\n\n(Réponse interrompue.)' }); else S.chat.pop(); }
    else if (partial && e && e.code !== 'refused') { S.chat.push({ role: 'assistant', content: partial + '\n\n(Réponse interrompue.)' }); toast(aiErrorText(e)); }
    else {
      const fb = fallback ? fallback() : '';
      if (fb) { S.chat.push({ role: 'assistant', content: fb }); toast(aiErrorText(e) + ' Voici le modèle prêt à l’emploi.'); }
      else { S.chat.pop(); toast(aiErrorText(e)); }
    }
  }
  UI.chatBusy = false; UI.chatStream = '';
  S.chat = S.chat.slice(-30); saveLocal();
  if (UI.tab === 'assistante') { render(); scrollChat(); }
}

    const btn = $('#cr-go');
    if (btn) { btn.disabled = true; btn.textContent = 'Lecture en cours…'; }
    const prompt = 'Voici mes notes brutes après un échange avec un prospect. Transforme-les en fiche.\nRéponds uniquement avec un objet JSON de cette forme : {"resume":"3 phrases au plus, à la première personne", "q1":"travaux qu’ils font faire le plus souvent et à quel rythme, vide si pas abordé", "q2":"qui s’en occupe aujourd’hui et ce qui pose problème, vide si pas abordé", "q3":"chantier à venir pour lequel un devis est possible, vide si pas abordé", "lots":null, "contactNom":"", "contactRole":"", "prochaineAction":"action précise à faire ensuite", "dansJours":3, "etape":"discussion ou client, ou vide si pas de changement"}\nlots = nombre de logements gérés, si c’est dit ; dansJours = nombre de jours avant la prochaine action, de 0 à 60.\nN’invente rien : laisse vide ou null ce qui n’est pas dans les notes.\nDate du jour : ' + todayISO() + '.\n\n' + ctxText(p) + '\n\nMes notes :\n' + txt.slice(0, 5000);
    try {
      const d = await runAI(prompt, { json: true });
      openDialog(dlgCRPreview(p, d && typeof d === 'object' ? d : { resume: txt }, txt));
    } catch (e) {
      if (e && e.code === 'cancelled') return;
      toast(aiErrorText(e));
      openDialog(dlgCRPreview(p, { resume: txt, dansJours: 3 }, txt));
    }
  },
  'cr-apply'(fd, form) {
    const p = S.prospects[form.dataset.id];
    if (!p) return;
    const str = k => String(fd.get(k) || '').trim();
    addLog(p, 'rdv', str('resume') || str('brut'));
    if (str('contactNom')) p.contactNom = str('contactNom');
    if (str('contactRole')) p.contactRole = str('contactRole');
    if (num(fd.get('lots'))) p.lots = num(fd.get('lots'));
    ['q1', 'q2', 'q3'].forEach(k => { if (str(k)) p[k] = str(k); });
    const et = str('etape');
    if (et && stageOf(et) && p.stage !== 'perdu' && stageIndex(et) > stageIndex(p.stage)) p.stage = et;
    else if (p.stage === 'a_contacter') p.stage = 'discussion';
    const date = isDate(fd.get('date')) ? String(fd.get('date')) : addDays(todayISO(), 3);
    p.next = { text: str('nextText') || (stageOf(p.stage) || STAGES[1]).next, date };
    commitProspect(p.id);
    closeDialog();
    if (UI.sheet && UI.sheet.id === p.id) refresh(); else { render(); openSheet('prospect', p.id); }
    toast('Compte rendu enregistré.');
  },
  settings(fd) {
    S.profile.prenom = String(fd.get('prenom') || '').trim().slice(0, 40);
    S.profile.named = true;
    S.settings.objectif = Math.max(1, Math.min(200, Math.round(Number(fd.get('objectif')) || 10)));
    S.settings.lassTel = String(fd.get('lassTel') || '').trim().slice(0, 30);
    S.settings.clients = String(fd.get('clients') || '').slice(0, 2000);
    let changed = 0;
    allProspects().forEach(p => { const before = p.dejaClient; if (checkDejaClient(p) !== before) { changed++; queueWrite(p.id); } });
    commitApp();
    renderSheet(); render();
    toast('Réglages enregistrés.' + (changed ? ' ' + changed + ' fiche' + (changed > 1 ? 's' : '') + ' mise' + (changed > 1 ? 's' : '') + ' à jour.' : ''));
  },
  async restore(fd) {
    let txt = String(fd.get('txt') || '').trim();
    const file = fd.get('file');
    if (!txt && file && file.size) { try { txt = await file.text(); } catch (e) { txt = ''; } }
    if (!txt) { toast('Colle le texte de ta sauvegarde, ou choisis le fichier.'); return; }
    let st;
    try { st = parseBackup(txt); } catch (e) { toast('Ce texte n’est pas une sauvegarde de l’outil. Vérifie que tu l’as copié en entier.'); return; }
    const keepChat = S.chat;
    const synced = S.meta.cloudSynced;
    S = st; S.chat = keepChat; S.meta.lastBackup = todayISO(); S.meta.changes = 0;
    S.meta.pending = {}; S.meta.cloudSynced = synced; S.meta.appSynced = synced;
    saveLocal();
    if (cloud.on && !cloud.migration) pushAllToCloud();
    else if (synced) { Object.keys(S.prospects).forEach(queueWrite); queueWrite('__app'); }
    closeDialog(); UI.sheet = null; renderSheet(); render();
    toast(count() + ' prospect' + (count() > 1 ? 's restaurés.' : ' restauré.'));
  }
};

/* ===== Actions ===== */
function markBackup() { S.meta.lastBackup = todayISO(); S.meta.changes = 0; saveLocal(); }
const ACTIONS = {
  tab(el) { go(el.dataset.tab); },
  open(el) { closeDialog(); if (S.prospects[el.dataset.id]) openSheet('prospect', el.dataset.id); },
  sheet(el) {
    if (el.dataset.type === 'guide' && !S.onboarding.guide) { S.onboarding.guide = true; saveLocal(); }
    openSheet(el.dataset.type);
  },
  'close-sheet'() { closeSheet(); },
  'close-dialog'() { closeDialog(); },
  'sync-info'() { openDialog(dlgSync()); },
  add() { openDialog(dlgProspectForm(null)); },
  edit(el) { const p = S.prospects[el.dataset.id]; if (p) openDialog(dlgProspectForm(p)); },
  filter(el) { UI.filter = el.dataset.f; render(); },
  'filter-go'(el) { UI.filter = el.dataset.f; go('prospects'); },
  'reco-filter'(el) { UI.recoFilter = el.dataset.f; UI.recoAll = false; render(); },
  'reco-more'() { UI.recoAll = true; render(); },
  'reco-add'(el) {
    const r = RECOS.find(x => x.id === el.dataset.id);
    if (!r || S.reco[r.id]) return;
    const p = newProspect({ nom: r.nom, type: r.type, reseau: r.reseau, zone: r.zone, ville: r.ville, adresse: r.adresse, tel: r.tel, site: r.site, lots: r.lots, f: recoFlags(r), source: 'agent', recoId: r.id, notes: r.conseil });
    addLog(p, 'note', 'Recommandé par l’agent. ' + r.pourquoi.join(' '));
    checkDejaClient(p);
    S.prospects[p.id] = p; S.reco[r.id] = 'added';
    commitProspect(p.id); commitApp();
    render();
    toast(r.nom + ' ajouté à tes prospects.');
  },
  'reco-skip'(el) { S.reco[el.dataset.id] = 'dismissed'; commitApp(); render(); },
  log(el) { const p = S.prospects[el.dataset.id]; if (p) openDialog(dlgLog(p, !!el.dataset.done)); },
  next(el) { const p = S.prospects[el.dataset.id]; if (p) openDialog(dlgNext(p)); },
  'stage-pick'(el) { const p = S.prospects[el.dataset.id]; if (p) openDialog(dlgStage(p)); },
  'stage-next'(el) {
    const p = S.prospects[el.dataset.id];
    if (!p) return;
    const nx = STAGES[stageIndex(p.stage) + 1];
    if (nx) ACTIONS['set-stage']({ dataset: { id: p.id, stage: nx.id } });
  },
  'set-stage'(el) {
    const p = S.prospects[el.dataset.id];
    const id = el.dataset.stage;
    if (!p || !stageOf(id)) return;
    if (id === 'transmis' && !p.transmisLe) { openDialog(dlgTransmettre(p)); return; }
    setStage(p, id);
    commitProspect(p.id);
    closeDialog(); refresh();
    toast('Étape : ' + stageLabel(id) + '.');
  },
  perdu(el) { const p = S.prospects[el.dataset.id]; if (p) openDialog(dlgPerdu(p)); },
  revive(el) {
    const p = S.prospects[el.dataset.id];
    if (!p) return;
    p.perduRaison = ''; p.stage = '';
    setStage(p, firstContact(p) ? 'discussion' : 'a_contacter');
    p.next = { text: 'Reprendre contact', date: todayISO() };
    commitProspect(p.id); refresh();
  },
  transmit(el) { const p = S.prospects[el.dataset.id]; if (p) openDialog(dlgTransmettre(p)); },
  chantier(el) {
    const p = S.prospects[el.dataset.id];
    if (!p) return;
    const ch = el.dataset.ch ? (p.chantiers || []).find(c => c.id === el.dataset.ch) : null;
    openDialog(dlgChantier(p, ch));
  },
  'chantier-del'(el) {
    const p = S.prospects[el.dataset.id];
    if (!p) return;
    p.chantiers = (p.chantiers || []).filter(c => c.id !== el.dataset.ch);
    commitProspect(p.id); closeDialog(); refresh();
  },
  questions(el) { const p = S.prospects[el.dataset.id]; if (p) openDialog(dlgQuestions(p)); },
  delete(el) {
    const p = S.prospects[el.dataset.id];
    if (p) openDialog(dlgConfirm({ title: 'Supprimer ce prospect ?', text: p.nom + ' et tout son historique seront effacés. Pour le garder en mémoire, choisis plutôt « Perdu ou plus tard ».', yes: 'Supprimer', action: 'do-delete', id: p.id, danger: true }));
  },
  'do-delete'(el) {
    const id = el.dataset.id;
    if (!S.prospects[id]) return;
    const rid = S.prospects[id].recoId;
    delete S.prospects[id];
    if (rid && S.reco[rid] === 'added') { delete S.reco[rid]; commitApp(); }
    if (UI.ctx === id) UI.ctx = '';
    touch(); saveLocal(); queueWrite(id);
    closeDialog(); UI.sheet = null; renderSheet(); render();
    toast('Prospect supprimé.');
  },
  avis(el) { prospectAvis(el.dataset.id); },
  quick(el) { runQuick(el.dataset.q, ''); },
  'quick-for'(el) {
    const id = el.dataset.id;
    UI.ctx = id;
    const q = QUICK.find(x => x.id === el.dataset.q);
    if (q && !q.special && !q.ask) go('assistante');
    runQuick(el.dataset.q, id);
  },
  async 'copy-msg'(el) {
    const m = S.chat[Number(el.dataset.i)];
    if (!m) return;
    toast((await copyText(m.content)) ? 'Copié.' : 'La copie est bloquée ici : sélectionne le texte à la main.');
  },
  'note-msg'(el) {
    const m = S.chat[Number(el.dataset.i)];
    const p = S.prospects[UI.ctx];
    if (!m || !p) return;
    addLog(p, 'note', m.content.slice(0, 1800));
    commitProspect(p.id);
    toast('Ajouté à la fiche de ' + p.nom + '.');
  },
  'ai-stop'() { if (ai.ctl) ai.ctl.abort(); },
  bridge(el) {
    const m = S.chat[Number(el.dataset.i)];
    if (m) openDialog(dlgBridge(kbText() + '\n\n' + m.content, UI.ctx && S.prospects[UI.ctx] ? UI.ctx : ''));
  },
  'bridge-advice'() { openDialog(dlgBridge(advicePrompt(), '')); },
  'bridge-avis'(el) { const p = S.prospects[el.dataset.id]; if (p) openDialog(dlgBridge(avisPrompt(p), p.id)); },
  'chat-clear'() { S.chat = []; saveLocal(); render(); },
  advice() { agentAdvice(); },
  coller() { openDialog(dlgColler()); },
  async 'copy-el'(el) {
    const t = document.getElementById(el.dataset.el);
    if (!t) return;
    const txt = (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' ? t.value : t.textContent).replace(/[\u00A0\u202F]/g, ' ');
    toast((await copyText(txt)) ? 'Copié.' : 'La copie est bloquée ici : sélectionne le texte à la main.');
  },
  backup() { openDialog(dlgBackup()); },
  async 'backup-copy'() {
    if (await copyText(backupText())) { markBackup(); toast('Sauvegarde copiée. Colle-la dans un message pour toi.'); refresh(); }
    else { const t = $('#bk-txt'); if (t) { t.focus(); t.select(); } toast('Sélectionne tout le texte, puis copie-le à la main.'); }
  },
  async 'backup-dl'() {
    if (!plat.downloads) return;
    try { await plat.downloads.save({ filename: 'amela-prospection-' + todayISO() + '.json', data: backupText() }); markBackup(); toast('Sauvegarde téléchargée.'); refresh(); }
    catch (e) { if (!(e && e.code === 'declined')) toast('Le téléchargement n’a pas abouti. Utilise « Copier la sauvegarde ».'); }
  },
  async csv() {
    const data = csvText();
    if (plat.downloads) { try { await plat.downloads.save({ filename: 'prospects-amela-' + todayISO() + '.csv', data }); toast('Tableau téléchargé.'); return; } catch (e) { if (e && e.code === 'declined') return; } }
    toast((await copyText(data)) ? 'Tableau copié : colle-le dans un tableur.' : 'L’export est bloqué ici.');
  },
  restore() { openDialog(dlgRestore()); },
  async 'cloud-test'() {
    if (!plat.db) return;
    try { await plat.db.doc('app/ping').set({ at: nowStamp() }); closeDialog(); startCloud(); toast('Sauvegarde en ligne activée.'); }
    catch (e) { toast('Pas d’accès en écriture pour l’instant. Tes données restent sur cet appareil.'); }
  },
  migrate() { pushAllToCloud(); toast('Tes prospects sont envoyés en ligne.'); },
  'take-remote'() { takeRemote(); toast('Version en ligne reprise.'); },
  'migrate-later'() { stopCloud(); toast('D’accord. Tes prospects restent sur cet appareil.'); },
  'onb-hide'() { S.onboarding.masque = true; saveLocal(); render(); },
  signout() { openDialog(dlgConfirm({ title: 'Se déconnecter ?', text: 'Tes fiches restent enregistrées en ligne. Cet appareil les oublie : il faudra ressaisir ton code pour les retrouver.' + (Object.keys(S.meta.pending || {}).length ? ' Attention : des modifications n’ont pas encore été envoyées, elles seraient perdues.' : ''), yes: 'Se déconnecter', action: 'do-signout' })); },
  'do-signout'() { if (AUTONOME) sbSignOut(); },
  wipe() { openDialog(dlgConfirm({ title: 'Tout effacer ?', text: (cloud.on ? 'Tous les prospects, les échanges et les réglages seront effacés, sur cet appareil et en ligne.' : 'Tous les prospects, les échanges et les réglages de cet appareil seront effacés.') + ' Fais une sauvegarde avant si tu veux les garder.', yes: 'Tout effacer', action: 'do-wipe', danger: true })); },
  'do-wipe'() {
    const ids = Object.keys(S.prospects);
    const synced = S.meta.cloudSynced;
    S = defaultState(); S.meta.cloudSynced = synced; S.meta.appSynced = synced; saveLocal();
    if (cloud.on || synced) { ids.forEach(queueWrite); queueWrite('__app'); }
    UI.ctx = ''; UI.advice = '';
    closeDialog(); UI.sheet = null; renderSheet(); go('accueil');
    toast('Tout est effacé.');
  }
};

/* ===== Démarrage ===== */
function bind() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el) { if (e.target.id === 'dialog') closeDialog(); return; }
    const fn = ACTIONS[el.dataset.action];
    if (!fn) return;
    if (el.tagName === 'A' && el.getAttribute('href') && el.getAttribute('href').charAt(0) === '#') e.preventDefault();
    fn(el, e);
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest('form[data-form]');
    if (!f) return;
    e.preventDefault();
    const fn = FORMS[f.dataset.form];
    if (fn) fn(new FormData(f), f, e);
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'q') { UI.q = t.value; const l = $('#plist'); if (l) setHTML(l, prospectList()); }
    else if (t.id === 'calc') { const o = $('#calc-out'); if (o) o.textContent = fmtEur(commission(num(t.value) || 0)); }
    else if (t.id === 'tx-msg') { const a = $('#tx-wa'); if (a) a.href = waLass(t.value); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'commune') { UI.commune = t.value; const l = $('#slinks'); if (l) setHTML(l, searchLinks()); }
    else if (t.id === 'ctx') { UI.ctx = t.value; renderChat(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!$('#dialog').hidden) closeDialog(); else if (UI.sheet) closeSheet(); }
  });
  window.addEventListener('hashchange', () => { const t = currentTab(); if (t !== UI.tab) { UI.tab = t; UI.sheet = null; renderSheet(); render(); } });
}
function boot() {
  if (AUTONOME) sbIaActiver(true);
  plat.ready.then(async () => {
    await loadShared();
    refresh();
    if (await canWriteCloud()) startCloud();
    refresh();
  }).catch(() => {});
}
function start() {
  if (AUTONOME) ai.off = true; /* l'IA s'allume dès que le serveur confirme que la clé est branchée */
  loadLocal();
  UI.tab = currentTab();
  bind();
  render();
  if (AUTONOME) {
    /* Hors de Claude : dès que la connexion revient, la sauvegarde en ligne reprend toute seule. */
    const retry = async () => { if (!cloud.on && !cloud.retry && remote.code && plat.db) { cloud.retry = true; try { if (await canWriteCloud()) startCloud(); } finally { cloud.retry = false; } } };
    window.addEventListener('online', () => { retry(); sbIaActiver(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { retry(); sbIaActiver(); } });
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
    if (!remote.code) { sbGate(''); return; }
  }
  boot();
}
start();

})();
</script>
